<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="__GOOGLE_FONTS_HREF__" rel="stylesheet">
<link rel="stylesheet" href="__TOKENS_CSS__">
<link rel="stylesheet" href="__LAYOUT_CSS__">
</head>
<body>
<!-- Editorial icon callouts — large thin-stroke icons floating over labels
     with generous whitespace, the ingredient-post treatment, not boxed UI
     chips. Whitespace does the separating; no cards. -->
<section class="rmp-slide rmp-slide--pad">
  <div class="rmp-doc-bar" style="padding-bottom:16px;margin-bottom:26px;">
    <div class="rmp-kicker">{{kicker}}</div>
    <div class="rmp-doc-meta">RM Psyllium · Gujarat, India</div>
  </div>
  <h2 class="rmp-h2" style="margin-bottom:20px;">{{headline}}</h2>
  <div class="rmp-gold-rule"></div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:26px 40px;flex:1;align-content:center;">
    {{#each items}}
    <div class="rmp-icon-callout">
      <div class="rmp-icon-callout__icon">{{{iconSvg}}}</div>
      <div class="rmp-icon-callout__label">{{label}}</div>
    </div>
    {{/each}}
  </div>

  <div class="rmp-doc-foot" style="padding-top:16px;margin-top:16px;">
    <div class="rmp-footer-slot rmp-footer-index"></div>
    <div class="rmp-footer-index">rmpsyllium.com</div>
  </div>
</section>
<script src="__FOOTER_INDEX_JS__"></script>
</body>
</html>
