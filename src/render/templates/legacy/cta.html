<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="__GOOGLE_FONTS_HREF__" rel="stylesheet">
<link rel="stylesheet" href="__TOKENS_CSS__">
<link rel="stylesheet" href="__LAYOUT_CSS__">
</head>
<body>
<section class="rmp-slide rmp-slide--pad rmp-slide--dark rmp-slide--space-between">
  <div class="rmp-doc-bar rmp-doc-bar--onDark">
    <div class="rmp-logo rmp-logo--onDark" style="-webkit-mask-image:url('__LOGO_DATA_URI__');mask-image:url('__LOGO_DATA_URI__');"></div>
    <div class="rmp-doc-meta rmp-doc-meta--onDark">Natural Fiber · Global Trust</div>
  </div>

  <div class="rmp-center-block">
    <div class="rmp-gold-rule" style="margin-bottom:30px;"></div>
    <h2 class="rmp-h2 rmp-h2--onDark" style="margin-bottom:24px;">{{headline}}</h2>
    <p class="rmp-body rmp-body--lg rmp-body--onDark" style="max-width:820px;margin-bottom:44px;">{{body}}</p>
    <div class="rmp-pill-cta">
      <div class="rmp-pill-cta__label">{{ctaLabel}}</div>
    </div>
  </div>

  <div class="rmp-doc-foot rmp-doc-foot--onDark">
    <div class="rmp-footer-index rmp-footer-index--onDark">{{contactLine}}</div>
    <div class="rmp-footer-slot rmp-footer-index rmp-footer-index--onDark" data-no-suffix></div>
  </div>
</section>
<script src="__FOOTER_INDEX_JS__"></script>
</body>
</html>
