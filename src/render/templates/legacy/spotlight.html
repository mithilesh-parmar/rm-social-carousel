<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="__GOOGLE_FONTS_HREF__" rel="stylesheet">
<link rel="stylesheet" href="__TOKENS_CSS__">
<link rel="stylesheet" href="__LAYOUT_CSS__">
</head>
<body>
<section class="rmp-slide rmp-slide--pad rmp-slide--dark rmp-slide--space-between">
  <div class="rmp-doc-bar rmp-doc-bar--onDark">
    <div class="rmp-kicker rmp-kicker--onDark">{{kicker}}</div>
    <div class="rmp-badge rmp-badge--onDark">{{badge}}</div>
  </div>

  <div class="rmp-center-block">
    <div class="rmp-gold-rule" style="margin-bottom:34px;"></div>
    <div style="display:flex;align-items:baseline;gap:18px;margin-bottom:22px;">
      <div style="font-family:var(--rmp-font-stat, var(--rmp-font-sans));font-size:var(--rmp-type-stat-hero-size);font-weight:800;letter-spacing:-0.02em;color:var(--rmp-bg);line-height:1;">{{statValue}}<span style="font-size:40px;font-weight:700;color:var(--rmp-gold);">{{statUnit}}</span></div>
    </div>
    <p class="rmp-body rmp-body--lg rmp-body--onDark" style="margin-bottom:8px;">{{statCaption}}</p>
    <h2 class="rmp-h2 rmp-h2--onDark" style="margin:36px 0 20px 0;">{{headline}}</h2>
    <p class="rmp-body rmp-body--lg rmp-body--onDark" style="max-width:880px;">{{body}}</p>
  </div>

  <div class="rmp-doc-foot rmp-doc-foot--onDark">
    <div class="rmp-footer-slot rmp-footer-index rmp-footer-index--onDark"></div>
    <div class="rmp-footer-index rmp-footer-index--onDark">rmpsyllium.com</div>
  </div>
</section>
<script src="__FOOTER_INDEX_JS__"></script>
</body>
</html>
