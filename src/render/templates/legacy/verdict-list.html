<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="__GOOGLE_FONTS_HREF__" rel="stylesheet">
<link rel="stylesheet" href="__TOKENS_CSS__">
<link rel="stylesheet" href="__LAYOUT_CSS__">
</head>
<body>
<section class="rmp-slide rmp-slide--pad">
  <div class="rmp-doc-bar" style="padding-bottom:16px;margin-bottom:26px;">
    <div class="rmp-kicker">{{kicker}}</div>
    <div class="rmp-doc-meta">RM Psyllium · Gujarat, India</div>
  </div>
  <h2 class="rmp-h2" style="margin-bottom:18px;">{{headline}}</h2>
  <p class="rmp-body rmp-body--lg" style="margin-bottom:32px;max-width:880px;">{{subhead}}</p>

  <!-- Rows intentionally have no flex:1: forcing 5 rows to equal height
       triggers CSS's implicit min-height:auto on flex items, which blocks
       shrinking below natural content size — if the rows' real content is
       taller than the available space, they'd silently overflow off the
       bottom of the canvas instead of the layout adapting. Natural sizing
       plus the schema's maxLength on `rule` (see verdictList.js) is what
       actually keeps this slide within the canvas now. -->
  <div style="display:flex;flex-direction:column;gap:14px;flex:1;justify-content:center;">
    {{#each rows}}
    <div class="rmp-card" style="display:flex;align-items:center;gap:26px;padding:20px 28px;">
      <div style="font-family:var(--rmp-font-mono);font-size:26px;font-weight:600;color:var(--rmp-accent-default);min-width:48px;">{{num}}</div>
      <div style="flex:1;">
        <div style="font-family:var(--rmp-font-sans);font-size:26px;font-weight:700;color:var(--rmp-green);margin-bottom:5px;">{{name}}</div>
        <div class="rmp-card-body">{{rule}}</div>
      </div>
    </div>
    {{/each}}
  </div>

  <div class="rmp-doc-foot" style="padding-top:16px;margin-top:16px;">
    <div class="rmp-footer-slot rmp-footer-index"></div>
    <div class="rmp-footer-index">rmpsyllium.com</div>
  </div>
</section>
<script src="__FOOTER_INDEX_JS__"></script>
</body>
</html>
