<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="__FONTS_CSS__">
<link rel="stylesheet" href="__TOKENS_CSS__">
<link rel="stylesheet" href="__BRANDED_CSS__">
<link rel="stylesheet" href="__THEME_CSS__">
</head>
<body data-rmp-theme="__THEME_NAME__">
<!-- Standalone single-image post: cover treatment field + CTA voice in one.
     Grid-safe for the same reason covers are. -->
<section class="rmpb-slide rmpb-slide--field rmpb-slide--gridsafe" data-rmp-cover="__COVER_ID__">
  {{{_watermarkTag}}}
  <div class="rmpb-frame">
    <header class="rmpb-cover-head rmpb-row" style="position:relative;">
      <div class="rmpb-lockup">
        {{{_lockupEmblemTag}}}
        <span class="rmpb-lockup__word">RM Psyllium</span>
      </div>
      <div class="rmpb-cover-badge">{{kicker}}</div>
    </header>

    <main class="rmpb-cover-main" style="gap:30px;">
      <h1 class="rmpb-cta-headline">{{{_headlineHtml}}}</h1>
      <div class="rmpb-pullline">{{statOrQuote}}</div>
      <p class="rmpb-cover-sub">{{body}}</p>
      <div class="rmpb-cta-action" style="margin-top:8px;">
        <span class="rmpb-cta-action__label">{{ctaLabel}}</span>
        <span class="rmpb-cta-action__arrow">&rarr;</span>
      </div>
    </main>

    <footer class="rmpb-cover-foot rmpb-row">
      <div class="rmpb-meta" style="text-transform:none;letter-spacing:0.06em;">{{contactLine}}</div>
      <div class="rmpb-meta">rmpsyllium.com</div>
    </footer>
  </div>
</section>
<script src="__CHROME_JS__"></script>
</body>
</html>
